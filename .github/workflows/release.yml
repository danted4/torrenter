name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag-on-main:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure tagged commit is on origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: build (${{ matrix.cli_artifact }})
    needs: verify-tag-on-main
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: torrenter-x86_64-unknown-linux-gnu
            gui_artifact: torrenter-gui-x86_64-unknown-linux-gnu
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: torrenter-aarch64-apple-darwin
            gui_artifact: torrenter-gui-aarch64-apple-darwin
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_artifact: torrenter-x86_64-apple-darwin
            gui_artifact: torrenter-gui-x86_64-apple-darwin
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: torrenter-x86_64-pc-windows-msvc.exe
            gui_artifact: torrenter-gui-x86_64-pc-windows-msvc.exe
            cli_exe: torrenter.exe
            gui_exe: torrenter-gui.exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: GUI system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Build CLI
        run: cargo build --locked --release --target ${{ matrix.target }} --bin torrenter
      - name: Build GUI
        run: cargo build --locked --release --target ${{ matrix.target }} --features gui --bin torrenter-gui
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cli_src="target/${{ matrix.target }}/release/${{ matrix.cli_exe }}"
          gui_src="target/${{ matrix.target }}/release/${{ matrix.gui_exe }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$cli_src" || true
            strip "$gui_src" || true
          fi
          cp "$cli_src" "dist/${{ matrix.cli_artifact }}"
          cp "$gui_src" "dist/${{ matrix.gui_artifact }}"
      - name: Package macOS .app zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --locked --release --features macos-app --bin macos-app -- \
            "dist/${{ matrix.gui_artifact }}" \
            "${GITHUB_REF_NAME}" \
            "dist/${{ matrix.gui_artifact }}.app.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/${{ matrix.cli_artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.gui_artifact }}
          path: dist/${{ matrix.gui_artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.gui_artifact }}.app.zip
          path: dist/${{ matrix.gui_artifact }}.app.zip
          if-no-files-found: error

  android-apk:
    name: build (torrenter-android.apk)
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-apk
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Native libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -P 30 -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs \
            build --locked --features ffi --release --lib
      # Signed with the project's release key (GitHub secrets), never a debug
      # key: a stable signer lets updates install over earlier versions and
      # lets Play Protect recognise the publisher across releases.
      - name: Release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to ship an APK without the release key"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Assemble release APK
        env:
          TORRENTER_KEYSTORE: ${{ runner.temp }}/release.jks
          TORRENTER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TORRENTER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TORRENTER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
        working-directory: android
      # The APK must be signed with exactly the project key (its certificate
      # SHA-256, a public value kept in the ANDROID_CERT_SHA256 repo
      # variable) and must not be debuggable: a swapped key would silently
      # break in-place updates for everyone.
      - name: Check the signature
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::error::ANDROID_CERT_SHA256 repo variable is not set"
            exit 1
          fi
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          signers=$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$RUNNER_TEMP/certs.txt" || true)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          if [ "$signers" != "1" ] || [ "$actual" != "$expected" ]; then
            echo "::error::the APK is not signed with the project key (got '$actual', expected '$expected')"
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          if grep -q "application-debuggable" "$RUNNER_TEMP/badging.txt"; then
            echo "::error::the APK is debuggable"
            exit 1
          fi
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/torrenter-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: torrenter-android.apk
          path: dist/torrenter-android.apk
          if-no-files-found: error

  publish:
    name: attach binaries to GitHub Release
    needs: [verify-tag-on-main, build, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag-on-main:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tagged commit is on origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: build (${{ matrix.cli_artifact }})
    needs: verify-tag-on-main
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: torrenter-x86_64-unknown-linux-gnu
            gui_artifact: torrenter-gui-x86_64-unknown-linux-gnu
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: torrenter-aarch64-apple-darwin
            gui_artifact: torrenter-gui-aarch64-apple-darwin
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_artifact: torrenter-x86_64-apple-darwin
            gui_artifact: torrenter-gui-x86_64-apple-darwin
            cli_exe: torrenter
            gui_exe: torrenter-gui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: torrenter-x86_64-pc-windows-msvc.exe
            gui_artifact: torrenter-gui-x86_64-pc-windows-msvc.exe
            cli_exe: torrenter.exe
            gui_exe: torrenter-gui.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: GUI system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Build CLI
        run: cargo build --locked --release --target ${{ matrix.target }} --bin torrenter
      - name: Build GUI
        run: cargo build --locked --release --target ${{ matrix.target }} --features gui --bin torrenter-gui
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cli_src="target/${{ matrix.target }}/release/${{ matrix.cli_exe }}"
          gui_src="target/${{ matrix.target }}/release/${{ matrix.gui_exe }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$cli_src" || true
            strip "$gui_src" || true
          fi
          cp "$cli_src" "dist/${{ matrix.cli_artifact }}"
          cp "$gui_src" "dist/${{ matrix.gui_artifact }}"
      - name: Package macOS .app zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --locked --release --features macos-app --bin macos-app -- \
            "dist/${{ matrix.gui_artifact }}" \
            "${GITHUB_REF_NAME}" \
            "dist/${{ matrix.gui_artifact }}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/${{ matrix.cli_artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_artifact }}
          path: dist/${{ matrix.gui_artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.gui_artifact }}.app.zip
          path: dist/${{ matrix.gui_artifact }}.app.zip
          if-no-files-found: error

  publish:
    name: attach binaries to GitHub Release
    needs: [verify-tag-on-main, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

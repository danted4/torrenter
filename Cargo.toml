[package]
name = "torrenter"
version = "3.2.0"
edition = "2021"
description = "CLI and native GUI: magnet/torrent and parallel multipart HTTP(S) with byte-range resume."
license = "MIT"
repository = "https://github.com/danted4/torrenter"
readme = "README.md"
keywords = ["torrent", "magnet", "download", "http", "cli"]
rust-version = "1.85"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:open"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.31", optional = true }
futures-util = "0.3"
indicatif = "0.17"
librqbit = { version = "9", default-features = false, features = ["rust-tls", "disable-upload"] }
open = { version = "5", optional = true }
percent-encoding = "2"
rfd = { version = "0.15", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "charset", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lib]
name = "torrenter"
path = "src/lib.rs"

[[bin]]
name = "torrenter"
path = "src/main.rs"

[[bin]]
name = "torrenter-gui"
path = "src/bin/torrenter-gui.rs"
required-features = ["gui"]

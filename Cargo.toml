[package]
name = "torrenter"
version = "3.7.1"
edition = "2021"
description = "CLI, native GUI, and stdio MCP: magnet/torrent and parallel multipart HTTP(S) with byte-range resume."
license = "MIT"
repository = "https://github.com/danted4/torrenter"
readme = "README.md"
keywords = ["torrent", "magnet", "download", "http", "cli"]
rust-version = "1.85"

[features]
default = []
gui = [
    "dep:eframe",
    "dep:rfd",
    "dep:open",
    "dep:winit",
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
]
macos-app = []
android-ndk = []
ios-xcframework = []
ffi = ["dep:uniffi"]
ffi-bindgen = ["ffi", "uniffi/cli"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
indicatif = "0.17"
librqbit = { version = "9", default-features = false, features = ["rust-tls", "disable-upload"] }
open = { version = "5", optional = true }
percent-encoding = "2"
raw-window-handle = { version = "0.6", optional = true }
rfd = { version = "0.15", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "charset", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.29", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# eframe 0.31 does not re-export `winit/default`; this unifies CSD (`sctk-adwaita`) while AccessKit stays off.
winit = { version = "0.30", optional = true }

# CLI `torrenter mcp` only. Keep off Android/iOS UniFFI natives.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 3.x needs rustc 1.88; keep 2.2 so MSRV 1.85 still builds.
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "server", "transport-io"] }
# CLI `torrenter debrid add`: read an API key without echoing it.
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSColor",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSThread",
] }
objc2-quartz-core = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CALayer",
    "objc2-core-foundation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "torrenter"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "torrenter"
path = "src/main.rs"

[[bin]]
name = "torrenter-gui"
path = "src/bin/torrenter-gui.rs"
required-features = ["gui"]

[[bin]]
name = "macos-app"
path = "src/bin/macos-app.rs"
required-features = ["macos-app"]

[[bin]]
name = "android-ndk"
path = "src/bin/android-ndk.rs"
required-features = ["android-ndk"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi-bindgen"]

[[bin]]
name = "ios-xcframework"
path = "src/bin/ios-xcframework.rs"
required-features = ["ios-xcframework"]

# iOS has no SO_BINDTODEVICE; use the same IP_BOUND_IF path as macOS.
[patch.crates-io]
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }
